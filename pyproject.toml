[project]
name = "stride-atlas"
version = "0.3.0"
description = "Local pipeline that turns an Apple Health export into the Stride Atlas dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lxml>=5.2",
  "duckdb>=1.1",
  "pyarrow>=16",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "requests>=2.32",
  "requests-cache>=1.2",
  "astral>=3.2",
  "timezonefinder>=6.5",
  "rasterio>=1.3",
  "osmnx>=1.9",
  "pyyaml>=6.0",
  "statsmodels>=0.14",
  "contourpy>=1.4.0",
  "reverse-geocoder>=1.5.1",
  "osmium>=4.3.1",
  "fitdecode>=0.11.0",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.scripts]
stride = "stride.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stride"
module-root = "pipeline"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
